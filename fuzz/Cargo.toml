[package]
name = "sendit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
sendit-core = { path = "../crates/core" }

[[bin]]
name = "sanitize"
path = "fuzz_targets/sanitize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "prepare_json"
path = "fuzz_targets/prepare_json.rs"
test = false
doc = false
bench = false
